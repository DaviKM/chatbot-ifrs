services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    container_name: python-app
    ports:
      - "6060:6060"
    env_file:
      - .env
    environment:
      - QDRANT_URL= http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # API REST/gRPC HTTP
      - "6334:6334"   # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    image: httpd:2.4
    container_name: apache-frontend
    ports:
      - "8080:80"
    volumes:
      - ./front:/usr/local/apache2/htdocs/
    restart: unless-stopped
    networks:
      - app-network



volumes:
  qdrant_data:
  ollama_data:

networks:
  app-network:
    driver: bridge