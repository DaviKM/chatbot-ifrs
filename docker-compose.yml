#      - ollama_data:/root/.ollama
#    networks:
#      - app-network
  app:
    build: .
    container_name: python-app
    ports:
      - "6060:6060"
    env_file:
      - .env
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # API REST/gRPC HTTP
      - "6334:6334"   # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=meubanco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  frontend:
    image: httpd:2.4
    container_name: apache-frontend
    ports:
      - "8080:80"
    volumes:
      - ./front:/usr/local/apache2/htdocs/
    restart: unless-stopped
    networks:
      - app-network



volumes:
  qdrant_data:
  ollama_data:
  postgres_data:

networks:
  app-network:
    driver: bridge