<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
    <input type="text" id="pergunta" placeholder="Digite sua pergunta...">
    <button type="button" onclick="fazerPergunta()" >Enviar</button>
    <br>
    <input type="file" id="arquivo">
    <button type="button" onclick="enviarArquivo()" >Enviar</button>
    <br>
    <input type="text" id="toDelete" placeholder="Digite o seu arquivo para deletar...">
    <button type="button" onclick="deletarArquivo()">Apagar</button>
    <br>
    <input type="text" id="telefone" oninput="pegarHistorico()" placeholder="Digite o número de telefone...">
    <button type="button" onclick="pegarHistorico()">Buscar Histórico</button>
    <br><br>
    <div id="chat-box" style="border: 1px solid #ccc; padding: 10px; max-width: 600px; min-height: 300px; overflow-y: auto;">
        <!-- As mensagens aparecerão aqui -->
    </div>
    <script>
        async function fazerPergunta()
        {
            const perguntaInput = document.getElementById('pergunta');
            const perguntaTexto = perguntaInput.value;
            if (!perguntaTexto) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<p><strong>Você:</strong> ${perguntaTexto}</p>`;

            const pergunta = {"pergunta": perguntaTexto, "tel": document.getElementById('telefone').value};
            const response = await fetch('http://localhost:6060/chat/query', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(pergunta)
            });
            const resposta = await response.json();
            
            chatBox.innerHTML += `<p><strong>Bot:</strong> ${resposta.resposta}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            perguntaInput.value = '';
        }
        async function enviarArquivo(){
            const formData = new FormData()
            const arquivo = document.getElementById('arquivo').files[0]
            formData.append('arquivo', arquivo)
            const response = await fetch('http://localhost:6060/rag/treinar', {
                method: 'POST',
                body: formData
            })
            const resposta = await response.json()
            alert(resposta)

        }

        async function deletarArquivo() {
            const arquivo = {'nome_arquivo': document.getElementById('toDelete').value}
            const response = await fetch('http://localhost:6060/rag/deletar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(arquivo)
            })
            const resposta = await response.json()
            alert(resposta)
        }

        async function pegarHistorico() {
            const tel = document.getElementById('telefone').value;
            if (!tel) {
                alert("Por favor, digite um número de telefone.");
                return;
            }
            try {
                const response = await fetch(`http://localhost:6060/chat/historico/${tel}`);
                const resposta = await response.json();
                
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = ''; // Limpar o chat atual

                resposta.forEach(msg => {
                    chatBox.innerHTML += `<p><strong>Você:</strong> ${msg.question}</p>`;
                    chatBox.innerHTML += `<p><strong>Bot:</strong> ${msg.answer}</p>`;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
                
            } catch (error) {
                console.error("Erro ao buscar histórico:", error);
                alert("Erro ao buscar histórico.");
            }
        }
    </script>
</body>
</html>
